<!doctype html>
<html lang="it"><head><meta charset="utf-8">

<style>

html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

header{padding:8px 12px 2px}

.bar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px;align-items:center}
.bar span{font-size:12px;opacity:.7}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
#c{flex:1;position:relative;touch-action:none;min-height:0}
#c canvas{display:block;width:100%;height:100%}
.lb{position:absolute;left:0;top:0;pointer-events:none;font-size:11px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap;opacity:.92}

#chips button{flex:none;font-size:12px;padding:4px 9px}

#pad button{padding:0;font-size:18px;opacity:.92}
footer{padding:4px 12px 8px;font-size:12px;opacity:.7}
</style></head>
<body>
<header><h1>Attico (4°) e superattico (5°)</h1>
<div class="bar"><button id="f4" class="on">Attico</button><button id="f5">Superattico</button><button id="f9">Insieme</button><button id="b3">Pareti basse</button></div>
<div class="bar"><span>Vista</span><button id="b0">Dall'alto</button><button id="b1" class="on">3D</button><button id="b2">Cammina dentro</button></div>
<div class="bar"><span>Scala</span><button id="s5">A sbalzo (moderna)</button><button id="s2">Chiocciola</button><button id="s7" class="on">Nascosta</button></div>
<div class="bar"><span>Stile bagni</span><button id="bs0" class="on">Mosaico</button><button id="bs1">Rustico</button></div>
<div class="bar"><span>Maioliche</span><button id="mj0" class="on">Chiare</button><button id="mj1">Colorate</button></div>
<div class="bar" id="bgB"><span>Bagno</span><button id="bg0" class="on">In cucina</button><button id="bg1">In salone</button></div>
<div class="bar" id="sotB"><span>Armadi sottoscala</span><button id="so0">Rustica</button><button id="so1" class="on">Moderna</button></div>
<div class="bar" style="display:none"><span>Pavimento</span><button id="p0" class="on">Cotto</button><button id="p1">Cotto a lisca di pesce</button></div>
<div class="bar"><span>Porte</span><button id="dr0" class="on">Chiuse</button><button id="dr1">Aperte</button></div>
<div class="bar"><span>Armadio</span><button id="ar0" class="on">Moderna</button><button id="ar1">Rustica</button></div>
</header>
<div id="c"><div id="chips"></div><div id="pad"></div></div>
<footer>Trascina per guardare/ruotare, pizzica per lo zoom. In "Cammina dentro" usa le frecce e i tasti stanza.</footer>
